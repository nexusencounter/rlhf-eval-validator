[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rlhf-eval-validator"
version = "0.2.0"
description = "CLI validator for SxS coding agent evaluations and RLHF JSONL batches"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Sudip Barman" }
]

[project.urls]
Repository = "https://github.com/nexusencounter/rlhf-eval-validator"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = "test_*.py"
